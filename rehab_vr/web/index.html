<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARIA — Return-to-Throw VR (Week 1 skeleton)</title>
<!-- GLTFLoader.js (and other three.js example modules) import Three.js
     internally via the bare specifier "three", not a full URL — this map
     is what lets that resolve, even though our own code below imports
     Three.js by full CDN URL directly and doesn't strictly need it. Must
     come before any <script type="module"> that transitively loads it. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e7ece7; font-family: ui-monospace, "SF Mono", Consolas, monospace; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(15,20,26,0.88); border: 1px solid #2a333a; border-radius: 8px;
    padding: 12px 16px; font-size: 13px; line-height: 1.7; min-width: 240px;
  }
  #hud h1 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 8px; color: #4fc7b0; font-weight: 700; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row .v { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  select.pick {
    background: #10151a; color: #e7ece7; border: 1px solid #2a333a; border-radius: 4px;
    font: inherit; font-size: 12px; padding: 1px 4px;
  }
  select.pick:focus-visible { outline: 2px solid #4fc7b0; outline-offset: 1px; }
  #cam { position: fixed; bottom: 12px; right: 12px; width: 240px; border: 1px solid #2a333a; border-radius: 8px; transform: scaleX(-1); z-index: 10; background: #000; }
  #overlay { position: fixed; bottom: 12px; right: 12px; width: 240px; height: 180px; transform: scaleX(-1); z-index: 11; pointer-events: none; }
  #status { position: fixed; top: 12px; right: 116px; z-index: 10; font-size: 11px; color: #6f7a6c; max-width: 220px; text-align: right; }
  #view-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 12;
    background: #17332e; color: #4fc7b0; border: 1px solid #2a333a; border-radius: 6px;
    font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    padding: 7px 12px; cursor: pointer;
  }
  #view-toggle:hover { background: #1d3f38; }

  #level-panel {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(15,20,26,0.9); border: 1px solid #2a333a; border-radius: 8px;
    padding: 10px 20px; text-align: center; min-width: 340px;
  }
  #level-panel .name { font-size: 14px; font-weight: 700; color: #4fc7b0; }
  #level-panel .desc { font-size: 11.5px; color: #a6b0a3; margin-top: 2px; }

  /* The "why" banner is the actual product claim — largest, most central
     piece of UI on the page, not a footnote. Flashes on update so a change
     is never missed. */
  #why-banner {
    position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(23,51,46,0.95); border: 1px solid #2e8b74; border-radius: 8px;
    padding: 10px 22px; text-align: center; min-width: 340px; max-width: 480px;
    font-size: 13px; color: #d7f3ea; font-weight: 600; transition: background 0.15s ease;
  }
  #why-banner.flash { background: #234f45; }
  #why-banner .sub { display: block; font-size: 10.5px; font-weight: 400; color: #8fb3a8; margin-top: 3px; }

  #sparkline { display: block; margin-top: 8px; width: 100%; height: 34px; }

  #log {
    position: fixed; bottom: 12px; left: 12px; z-index: 10; max-width: 380px;
    background: rgba(15,20,26,0.88); border: 1px solid #2a333a; border-radius: 8px;
    padding: 10px 14px; font-size: 11.5px; color: #a6b0a3; max-height: 120px; overflow-y: auto;
  }
  #log h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; color: #6f7a6c; }
  #log .entry { margin-bottom: 4px; }
  #log .entry .t { color: #6f7a6c; margin-right: 6px; }

  /* Athlete view: hide raw clinical numbers and the technical log, keep
     motion state + the plain-language why-banner + level name. */
  body.athlete-view .trainer-only { display: none; }
  body.athlete-view #hud h1::after { content: " · athlete view"; color: #6f7a6c; font-weight: 400; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body class="trainer-view">
  <button id="view-toggle">Switch to athlete view</button>
  <div id="hud">
    <h1>ARIA — sensor fusion</h1>
    <div class="row trainer-only"><span>EDA</span><span class="v" id="v-eda">&mdash;</span></div>
    <div class="row trainer-only"><span>Heart rate</span><span class="v" id="v-hr">&mdash;</span></div>
    <div class="row trainer-only"><span>Skin temp</span><span class="v" id="v-temp">&mdash;</span></div>
    <div class="row trainer-only"><span>Arousal score</span><span class="v" id="v-score">&mdash;</span></div>
    <div class="row"><span>Motion state</span><span class="v" id="v-motion">no camera yet</span></div>
    <div class="row"><span>Pitches thrown</span><span class="v" id="v-pitch-count">0</span></div>
    <div class="row trainer-only"><span>Release speed</span><span class="v" id="v-release-speed">&mdash;</span></div>
    <div class="row"><span>Throwing arm</span>
      <select id="arm-select" class="pick"><option value="right">Right</option><option value="left">Left</option></select>
    </div>
    <div class="row"><span>Activity</span><select id="activity-select" class="pick"></select></div>
    <div class="row"><span>Setting</span><select id="venue-select" class="pick"></select></div>
    <div class="row trainer-only"><span>Resting baseline</span>
      <button id="calibrate-btn" class="pick" type="button">Calibrate (30 s)</button>
    </div>
    <canvas id="sparkline" class="trainer-only" width="240" height="34"></canvas>
  </div>
  <div id="level-panel">
    <div class="name" id="v-level-name">&mdash;</div>
    <div class="desc" id="v-level-desc">&mdash;</div>
  </div>
  <div id="why-banner">
    <span id="why-text">Reading your response&hellip;</span>
    <span class="sub trainer-only" id="why-technical"></span>
  </div>
  <div id="log" class="trainer-only">
    <h2>Adaptation log (trainer)</h2>
    <div id="log-entries"></div>
  </div>
  <div id="status">connecting to sensor service&hellip;</div>
  <div id="scene"></div>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
